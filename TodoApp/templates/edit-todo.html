{% include 'layout.html' %}

<main class="page page--narrow">

  <header class="page-header">
    <div>
      <h1 class="page-title">Edit task</h1>
      <p class="page-subtitle">Update the details below.</p>
    </div>
  </header>

  <section class="surface surface__pad-lg">
    <form id="editTodoForm" class="form" autocomplete="off">
      <div class="field">
        <label class="field__label" for="editTitle">Title</label>
        <input id="editTitle" class="input" type="text" name="title" value="{{ todo.title }}" required minlength="3">
      </div>

      <div class="field">
        <label class="field__label" for="editDescription">Description</label>
        <textarea id="editDescription" class="textarea" name="description" rows="3" maxlength="100">{{ todo.description }}</textarea>
      </div>

      <div class="field">
        <label class="field__label" for="editPriority">Priority</label>
        <select id="editPriority" name="priority" data-pretty data-color-prefix="p-color-">
          <option value="1" {% if todo.priority == 1 %}selected{% endif %}>P1 · Low</option>
          <option value="2" {% if todo.priority == 2 %}selected{% endif %}>P2</option>
          <option value="3" {% if todo.priority == 3 %}selected{% endif %}>P3 · Normal</option>
          <option value="4" {% if todo.priority == 4 %}selected{% endif %}>P4</option>
          <option value="5" {% if todo.priority == 5 %}selected{% endif %}>P5 · Urgent</option>
        </select>
      </div>

      <label class="check">
        <input type="checkbox" name="complete" {% if todo.complete %}checked{% endif %}>
        <span>Mark as complete</span>
      </label>

      <div class="form-actions">
        <a href="/todos/todo-page" class="btn btn--ghost">Cancel</a>
        <button id="deleteButton" type="button" class="btn btn--danger">Delete</button>
        <span class="spacer"></span>
        <button type="submit" class="btn btn--primary">Save changes</button>
      </div>
    </form>
  </section>

</main>
