{% include 'layout.html' %}

<main class="page">

  <header class="page-header">
    <div>
      <h1 class="page-title">Today</h1>
      <p class="page-subtitle">What do you want to get done?</p>
    </div>
  </header>

  <form id="quickAddForm" class="quick-add" autocomplete="off">
    <input id="quickAddInput" class="quick-add__input" name="title"
           type="text" placeholder="Add a task and press Enter…" required minlength="3">
    <select id="quickAddPriority" name="priority" aria-label="Priority"
            data-pretty="inline" data-color-prefix="p-color-">
      <option value="1">P1 · Low</option>
      <option value="2">P2</option>
      <option value="3" selected>P3 · Normal</option>
      <option value="4">P4</option>
      <option value="5">P5 · Urgent</option>
    </select>
    <button type="submit" class="btn btn--primary btn--sm">Add</button>
  </form>

  <div class="todo-toolbar">
    <div class="todo-toolbar__filters" role="tablist">
      <button type="button" class="filter-btn is-active" data-filter="all">All<span class="count-pill" id="countAll">0</span></button>
      <button type="button" class="filter-btn" data-filter="active">Active<span class="count-pill" id="countActive">0</span></button>
      <button type="button" class="filter-btn" data-filter="done">Done<span class="count-pill" id="countDone">0</span></button>
    </div>
  </div>

  <ul id="todoList" class="todo-list">
    {% for todo in todos %}
      <li class="todo-item {% if todo.complete %}is-done{% endif %}"
          data-id="{{ todo.id }}"
          data-title="{{ todo.title }}"
          data-description="{{ todo.description }}"
          data-priority="{{ todo.priority }}"
          data-complete="{{ 'true' if todo.complete else 'false' }}">
        <input type="checkbox" class="todo-check" {% if todo.complete %}checked{% endif %} aria-label="Toggle complete">
        <div class="todo-item__body">
          <div class="todo-item__title">{{ todo.title }}</div>
          <div class="todo-item__meta">
            <span class="priority priority-{{ todo.priority }}">P{{ todo.priority }}</span>
          </div>
        </div>
        <div class="todo-item__actions">
          <a class="icon-btn" href="edit-todo-page/{{ todo.id }}" aria-label="Edit" title="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          </a>
          <button type="button" class="icon-btn icon-btn--danger" data-action="delete" aria-label="Delete" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </li>
    {% endfor %}
  </ul>

  <div id="emptyState" class="empty" hidden>
    <div class="empty__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <p class="empty__title">All clear</p>
    <p class="empty__body">Add your first task above to get started.</p>
  </div>

</main>
