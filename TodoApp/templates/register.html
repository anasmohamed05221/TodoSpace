{% include 'layout.html' %}

<main class="auth-wrap">
  <div class="auth-card auth-card--wide">
    <div class="auth-head">
      <h1 class="auth-head__title">Create your account</h1>
      <p class="auth-head__subtitle">It only takes a minute.</p>
    </div>

    <section class="surface surface__pad-lg">
      <form id="registerForm" class="form">
        <div class="form-row">
          <div class="field">
            <label class="field__label" for="regEmail">Email</label>
            <input id="regEmail" class="input" type="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="field__label" for="regUsername">Username</label>
            <input id="regUsername" class="input" type="text" name="username" autocomplete="username" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label class="field__label" for="regFirst">First name</label>
            <input id="regFirst" class="input" type="text" name="firstname" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label class="field__label" for="regLast">Last name</label>
            <input id="regLast" class="input" type="text" name="lastname" autocomplete="family-name" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label class="field__label" for="regPassword">Password</label>
            <input id="regPassword" class="input" type="password" name="password" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label class="field__label" for="regPassword2">Verify password</label>
            <input id="regPassword2" class="input" type="password" name="password2" autocomplete="new-password" required>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Create account</button>
      </form>
    </section>

    <p class="auth-foot">
      Already have an account? <a href="/auth/login-page">Sign in</a>
    </p>
  </div>
</main>
